name: Draw Keymap
on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - .github/workflows/draw.yml
      - keymap_drawer.config.yaml

jobs:
  draw:
    # Pinned to a commit: this third-party workflow gets contents: write and
    # pushes commits to this repo. SHA is caksoylar/keymap-drawer main as of
    # 2026-11-18 (467abe2, "fix: Fix top alias for shifted in LayoutKey (#217)").
    # To update: git ls-remote https://github.com/caksoylar/keymap-drawer.git refs/heads/main
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@467abe2a2fee3a1ec1658d8c3fe33d1cc562b53c
    permissions:
      contents: write
    with:
      commit_message: "[Draw] ${{ github.event.head_commit.message }}"
      destination: "commit"
      fail_on_error: ${{ fromJSON(true) }}
